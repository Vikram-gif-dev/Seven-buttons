<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Bootstrap Buttons</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="p-4">
  <h3>7 Bootstrap Button Styles</h3>
  <div class="btn-box mt-3">
    <button class="btn btn-primary">1. Primary</button>
    <button class="btn btn-secondary">2. Secondary</button>
    <button class="btn btn-success">3. Success</button>
    <button class="btn btn-danger">4. Danger</button>
    <button class="btn btn-warning">5. Warning</button>
    <button class="btn btn-info">6. Info</button>
    <button class="btn btn-outline-dark">7. Outline Dark</button>
  </div>
</body>
</html>
